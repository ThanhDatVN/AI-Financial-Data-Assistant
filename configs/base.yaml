project:
  seed: 20260802
  data_root: data/raw/ViFinQA
  questions_path: data/raw/ViFinQA/questions/questions.jsonl
  companies_path: data/raw/ViFinQA/code_stock.csv

table_refs:
  # Companion ViFinQA commit 9a046de uses doc_id|table_N. Keep this configurable
  # until the competition dashboard validates the exact public-submission grammar.
  format: "{doc_id}|table_{table_id}"
  first_table_id: 1

parsing:
  context_lines_before: 8
  max_header_rows: 3
  dash_value: 0.0
  fail_on_unclosed_table: false

retrieval:
  first_stage: bm25
  first_stage_k: 200
  # Large internal pool before metadata filtering/fusion; not the submission k.
  candidate_k: 2000
  final_k: 10
  rrf_k: 60
  metadata_policy: safe
  dense_model: BAAI/bge-m3
  reranker_model: BAAI/bge-reranker-v2-m3

evaluation:
  beta: 2.0
  # Companion-paper parity only. The public statement delegates the allowed
  # tolerance to the organizer; verify on the dashboard before submission.
  answer_abs_tolerance: 0.01
